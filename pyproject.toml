[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tovitunes"
version = "0.1.0"
description = "Durable foundation for ToviTunes educational animation production"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSES/AGPL-3.0-or-later.txt"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "Pillow>=11,<13",
    "google-genai>=1.0,<2.0",
    "google-auth>=2,<3",
    "httpx>=0.28,<1",
    "miniaudio>=1.63,<2",
    "mutagen>=1.47,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]
video-render = ["moviepy==2.2.1"]
audio-analysis = ["librosa>=0.11,<1"]
audio-timing = ["beat-this==1.1.0"]
audio-asr = ["whisperx>=3.7,<4; python_version < '3.13'"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
youtube = ["google-api-python-client>=2.160,<3", "google-auth-oauthlib>=1.2,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tovitunes = ["persistence/migrations/*.sql", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["tovitunes"]
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "miniaudio", "mutagen.*", "librosa", "numpy", "torch", "torchaudio", "whisperx", "whisperx.*", "faster_whisper.*", "ctranslate2", "nltk", "beat_this.*", "moviepy", "moviepy.*", "googleapiclient.*", "google_auth_oauthlib.*", "httplib2.*"]
ignore_missing_imports = true
