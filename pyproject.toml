[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tovitunes"
version = "0.1.0"
description = "Durable foundation for ToviTunes educational animation production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "Pillow>=11,<13",
    "google-genai>=1.0,<2.0",
    "google-auth>=2,<3",
    "httpx>=0.28,<1",
    "miniaudio>=1.63,<2",
    "mutagen>=1.47,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tovitunes = ["persistence/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["tovitunes"]
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "miniaudio", "mutagen.*"]
ignore_missing_imports = true
