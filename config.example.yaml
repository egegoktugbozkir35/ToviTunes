schema_version: 1
database_path: data/tovitunes.db
data_root: data
brand_root: brands/tovitunes
publication_enabled: false
expected_youtube_channel_id: null
publication:
  youtube:
    enabled: false
    credentials_file: secrets/client_secret.json
    token_file: secrets/youtube_token.json
    category_id: "27"
    upload_chunk_size: -1
    max_retries: 5
    contains_synthetic_media: true
environment_generation:
  provider: qwen_comfyui
  model: qwen-image-2.1-q8
  base_url: http://127.0.0.1:8188
  workflow_path: workflows/qwen_image_2_1_t2i_api.json
  width: 768
  height: 1376
  steps: 20
  cfg: 1.0
  sampler: euler
  scheduler: simple
  timeout_seconds: 600
  poll_interval_seconds: 1
lesson_object_generation:
  provider: qwen_comfyui
  model: qwen-image-2.1-q8
  base_url: http://127.0.0.1:8188
  workflow_path: workflows/qwen_image_2_1_t2i_api.json
  width: 1024
  height: 1024
  steps: 20
  cfg: 1.0
  sampler: euler
  scheduler: simple
  timeout_seconds: 600
  poll_interval_seconds: 1
music_generation:
  provider: ace_step_local
  base_url: http://127.0.0.1:8001
  model: acestep-v15-turbo
  lm_model: acestep-5Hz-lm-0.6B
  lm_backend: pt
  thinking: true
  inference_steps: 8
  audio_format: wav
  batch_size: 1
  timeout_seconds: 1800
  poll_interval_seconds: 2
automation:
  auto_publish: false
  publish_visibility: private
  require_human_review: true
  asr_model: small.en
  analysis_device: auto
  allow_model_download: false
  analysis_version: 1
creative_llm:
  provider: nvidia
  model: moonshotai/kimi-k3
  base_url: https://integrate.api.nvidia.com/v1
  api_key_env: NVIDIA_API_KEY
  timeout_seconds: 1800
  temperature: 0.7
  max_tokens: 16384
  fallback_models:
    - z-ai/glm-5.3
    - nvidia/nemotron-3-ultra-550b-a55b
    - deepseek-ai/deepseek-v4.1-flash
  fallback_to_ollama_on_endpoint_failure: false
  ollama:
    base_url: http://127.0.0.1:11434
    model: qwen3.8:27b-q4_K_M
    timeout_seconds: 240
    temperature: 0.7

