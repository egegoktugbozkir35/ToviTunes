forbidden_changes:
- Remove or replace the musical-note tuft.
- Change Tovi to another species or realistic bird anatomy.
- Change the core sky-blue body color.
- Materially change the cream face or belly pattern.
- Replace the large glossy blue eyes with realistic bird eyes.
- Add human hands or arms.
- Add permanent clothing without a pack revision.
- Change the beak or feet away from the warm orange family.
- Change the compact child-friendly head-to-body proportions.
- Add extra wings, eyes, feet, or other major anatomy.
visual_rules:
  silhouette: Compact rounded baby bird with an oversized round head, small oval torso,
    short legs, orange three-toed feet, and compact layered feather wings.
  proportions: Head is substantially larger than the torso; eyes dominate the upper
    face; legs and feet stay small, and wings remain feathered rather than arm-like.
  eyes: Very large, rounded glossy blue eyes with dark navy pupils, blue iris gradient,
    white sclera, and bright highlights; retain their wide spacing.
  beak: Small warm-orange rounded beak centered low between the eyes; keep the child-friendly
    upper beak and curved smiling lower mouth.
  tuft: One prominent blue feather tuft rises as a recognizable musical note above
    the head; keep its bent note shape and layered feather base.
